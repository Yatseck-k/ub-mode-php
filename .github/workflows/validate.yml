name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill metadata and documentation
        shell: python
        run: |
          from pathlib import Path
          import re

          skill = Path("SKILL.md")
          readme = Path("README.md")
          assert skill.is_file(), "SKILL.md is missing"
          assert readme.is_file(), "README.md is missing"
          content = skill.read_text(encoding="utf-8")
          frontmatter = re.match(r"\A---\r?\n(.*?)\r?\n---\r?\n", content, re.S)
          assert frontmatter, "SKILL.md must begin with YAML frontmatter"
          for key in ("name", "description"):
              assert re.search(rf"(?m)^{key}:\s*\S", frontmatter.group(1)), f"Missing {key}"
          assert readme.read_text(encoding="utf-8").strip(), "README.md is empty"
